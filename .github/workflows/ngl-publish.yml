name: Publish reviewed Hurricane to NGL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngl-hurricane-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ngl-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      NGL_SOURCE_COMMIT: abb7d335572bcb1d7118205228b99de8176b0caf
      NGL_APPLICATION_ID: 2a9acadc-9644-4cfe-8343-c77079126034
      NGL_PUBLISHER_ID: ${{ vars.NGL_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject application payload drift
        run: git diff --exit-code "$NGL_SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude).github'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: abb7d335572bcb1d7118205228b99de8176b0caf
          path: reviewed-source
          persist-credentials: false
      - name: Retrieve the exact retained Hurricane build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 36150471752 \
            --repo apfister/arcgis-aicomponents-hurricanerisk-demoapp \
            --name hurricane-ngl-36150471752-1 --dir ngl-retained
      - name: Publish the unchanged Artifact with genuine GitHub Actions OIDC
        run: python3 .github/ngl/publish.py
      - name: Retain repeatable publication artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hurricane-ngl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ngl-publication/
          if-no-files-found: error
          retention-days: 30
